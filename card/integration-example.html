<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Card Art — Integration Example</title>
  <style>
    :root {
      --felt: #0c3d35;
      --felt-dark: #062822;
      --ivory: #f6eddc;
      --ink: #0b1f33;
      --red: #9d2433;
      --gold: #b99549;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #fff8e9;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.07), transparent 36%),
        linear-gradient(145deg, var(--felt), var(--felt-dark));
    }

    .table {
      width: min(94vw, 860px);
      padding: clamp(24px, 5vw, 56px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 38px);
      letter-spacing: .08em;
    }

    p {
      margin: 0 0 32px;
      color: rgba(255,248,233,.72);
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }

    .hand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 18px);
      flex-wrap: wrap;
    }

    /* 840 × 1176 px atlas: [back, J] / [Q, K] */
    .card {
      --art-x: -999%;
      --art-y: -999%;
      position: relative;
      width: clamp(92px, 16vw, 132px);
      aspect-ratio: 5 / 7;
      overflow: hidden;
      isolation: isolate;
      color: var(--ink);
      border: 1px solid rgba(86,65,29,.35);
      border-radius: 8%;
      background: var(--ivory);
      box-shadow: 0 13px 24px rgba(0,0,0,.28), inset 0 0 0 2px rgba(255,255,255,.45);
      transform: translateY(var(--lift, 0)) rotate(var(--tilt, 0));
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .card:hover {
      --lift: -8px;
      box-shadow: 0 18px 30px rgba(0,0,0,.36), inset 0 0 0 2px rgba(255,255,255,.45);
    }

    .card::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 5%;
      background-image: url("./poker-court-atlas.webp");
      background-repeat: no-repeat;
      background-size: 200% 200%;
      background-position: var(--art-x) var(--art-y);
    }

    .card[data-rank="J"] { --art-x: 100%; --art-y: 0%; }
    .card[data-rank="Q"] { --art-x: 0%; --art-y: 100%; }
    .card[data-rank="K"] { --art-x: 100%; --art-y: 100%; }

    .card[data-suit="♥"],
    .card[data-suit="♦"] { color: var(--red); }

    .card::after,
    .corner {
      position: absolute;
      z-index: 2;
      width: 20%;
      white-space: pre;
      text-align: center;
      font-weight: 700;
      font-size: clamp(17px, 3vw, 24px);
      line-height: .78;
      text-shadow: 0 1px rgba(255,255,255,.65);
    }

    .corner {
      top: 6%;
      left: 4%;
    }

    .corner::before {
      content: attr(data-rank) "\A" attr(data-suit);
      white-space: pre;
    }

    .card::after {
      content: attr(data-rank) "\A" attr(data-suit);
      right: 4%;
      bottom: 6%;
      transform: rotate(180deg);
    }

    .card--back {
      border: 0;
      background: transparent;
    }

    .card--back::before {
      inset: 0;
      background-position: 0% 0%;
    }

    .card--back::after { content: none; }
  </style>
</head>
<body>
  <main class="table">
    <h1>NOCTURNE POKER</h1>
    <p>軽量WebPアトラス1枚で、裏面とJ/Q/Kを表示する組み込み例</p>
    <div class="hand">
      <div class="card card--back" aria-label="伏せたカード"></div>
      <div class="card" data-rank="J" data-suit="♠" style="--tilt:-2deg" aria-label="スペードのジャック">
        <span class="corner" data-rank="J" data-suit="♠"></span>
      </div>
      <div class="card" data-rank="Q" data-suit="♥" aria-label="ハートのクイーン">
        <span class="corner" data-rank="Q" data-suit="♥"></span>
      </div>
      <div class="card" data-rank="K" data-suit="♣" style="--tilt:2deg" aria-label="クラブのキング">
        <span class="corner" data-rank="K" data-suit="♣"></span>
      </div>
    </div>
  </main>
</body>
</html>
